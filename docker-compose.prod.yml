services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: scc-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tucdrive}
      MYSQL_USER: ${MYSQL_USER:-tucdrive_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u${MYSQL_USER:-tucdrive_user}",
          "-p${MYSQL_PASSWORD:-change_me}",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scc-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-tucdrive_user}:${MYSQL_PASSWORD:-change_me}@db:3306/${MYSQL_DATABASE:-tucdrive}
      SECRET_KEY: ${SECRET_KEY:-please_change_this_secret}
      ACCESS_TOKEN_EXPIRE_SECONDS: ${ACCESS_TOKEN_EXPIRE_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
